[app:main]
use = egg:zam_repondeur

sqlalchemy.url = postgresql://postgres@localhost/circle_test?application_name=%(app)s

zam.log_sql_queries_with_origin = false

zam.tasks.redis_url = redis://localhost:6379/10
zam.data.redis_url = redis://localhost:6379/11
zam.users.redis_url = redis://localhost:6379/12
zam.amendements.redis_url = redis://localhost:6379/13

zam.users.auth_token_duration = 300
zam.users.max_token_requests_per_email_per_minute = 10
zam.users.max_token_requests_per_ip_per_minute = 50
zam.users.max_token_validations_per_ip_per_minute = 50

zam.session_secret = DD85AED2-7920-443B-81FA-10129D6B1B15

zam.auth_secret = 066713E3-7911-4CC5-813D-F72B3C7D3E0E
zam.auth_cookie_secure = false


[alembic]
script_location = db_migrations
sqlalchemy.url = postgresql://postgres@localhost/circle_test?application_name=alembic


###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, sqlalchemy, alembic, requests

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
qualname = sqlalchemy.engine
level = WARNING
handlers =

[logger_alembic]
qualname = alembic
level = INFO
handlers =

[logger_requests]
qualname = urllib3
level = DEBUG
handlers =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
