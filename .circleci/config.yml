version: 2

workflows:
  version: 2

  on-push:
    jobs:
      - run-tests:
          filters:
            branches:
              ignore:
                # ignore branches created by autorebase https://github.com/tibdex/autorebase
                - /rebase-pull-request-.*/
                - /cherry-pick-rebase-pull-request-.*/

  nightly:
    triggers:
      - schedule:
          # run every day at 14:53 UTC (for testing, will move to nightly hours later)
          cron: "53 14 * * *"
          filters:
            branches:
              only:
                - master
                - ci-periodic-fetch
    jobs:
      - fetch-amendements

jobs:

  run-tests:
    docker:
      - image: circleci/python:3.6-stretch-browsers
        environment:
          ZAM_TEST_DB_URL: postgresql://postgres@localhost/circle_test
      - image: circleci/postgres:10.6-alpine-ram
      - image: redis
    steps:
      - checkout
      - run:
          name: Check versions
          command: |
            python --version
            pip --version
            geckodriver --version
            firefox --version
            chromedriver --version
            google-chrome --version
      - run:
          name: Install system deps
          command: sudo apt-get install -y wkhtmltopdf xvfb xclip
      - run:
          name: Install Python deps
          command: |
            cd repondeur
            sudo pip install --no-use-pep517 --progress-bar off -r requirements.txt -r requirements-dev.txt -e . --log pip.log
            ! grep ERROR pip.log
      - run:
          name: Check Python deps conflicts
          command: |
            cd repondeur
            python -c "from paste.deploy.loadwsgi import appconfig ; appconfig('config:development.ini', relative_to='.', global_conf={'app': 'test'})"
      - run:
          name: Check formatting with black
          command: |
            cd repondeur
            black --check .
      - run:
          name: Check coding style with flake8
          command: |
            cd repondeur
            flake8
      - run:
          name: Check type annotations with mypy
          command: |
            cd repondeur
            mypy zam_repondeur
      - run:
          name: Check import order with isort
          command: |
            cd repondeur
            isort --recursive --check-only .
      - run:
          name: Check for potential security issues with bandit
          command: |
            cd repondeur
            bandit -r zam_repondeur
      - run:
          name: Run tests
          command: |
            cd repondeur
            sudo sed --in-place '/fr_FR.UTF-8/s/^#//' /etc/locale.gen
            sudo locale-gen fr_FR.UTF-8
            mkdir -p test-reports
            pytest -p no:sugar -vv --junitxml=test-reports/junit.xml --cov=zam_repondeur tests/
      - store_test_results:
          path: repondeur/test-reports

  fetch-amendements:
    docker:
      - image: circleci/python:3.6-stretch
      - image: circleci/postgres:10.6-alpine-ram
      - image: redis
    steps:
      - checkout
      - run:
          name: Setup french locale
          command: |
            echo 'fr_FR.UTF-8 UTF-8' | sudo tee -a /etc/locale.gen
            echo 'LANG="fr_FR.UTF-8"' | sudo tee /etc/default/locale
            sudo dpkg-reconfigure --frontend=noninteractive locales
            sudo update-locale LANG=fr_FR.UTF-8
      - run:
          name: Check versions
          command: |
            python --version
            pip --version
      - run:
          name: Install Python deps
          command: |
            cd repondeur
            sudo pip install --no-use-pep517 -r requirements.txt -e . --log pip.log
            ! grep ERROR pip.log
      - run:
          name: Initialize database
          command: |
            cd repondeur
            alembic --config=circleci.ini upgrade head
      - run:
          name: Fetch amendements
          command: |
            cd repondeur
            zam_fetch_amendements circleci.ini --verbose
          no_output_timeout: 30m
